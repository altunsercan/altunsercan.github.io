name: Deploy to GitHub Pages

on:
  push:
    branches:
      - source
  pull_request:
    branches:
      - source

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to master branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/source'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Create or switch to master branch
          git checkout -B master
          
          # Remove all files except dist and .git
          find . -maxdepth 1 -not -name 'dist' -not -name '.git' -not -name '.' -exec rm -rf {} + 2>/dev/null || true
          
          # Move dist contents to root
          if [ -d "dist" ]; then
            mv dist/* . 2>/dev/null || true
            mv dist/.* . 2>/dev/null || true
            rmdir dist 2>/dev/null || true
          fi
          
          # Add and commit changes
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy from source branch - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin master
          fi